name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://example.execute-api.ap-northeast-1.amazonaws.com
        run: npm run build

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://example.execute-api.ap-northeast-1.amazonaws.com
        run: npm run build

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci

      - name: Build infrastructure
        working-directory: infra
        run: npm run build

      - name: CDK synth
        working-directory: infra
        env:
          ALARM_EMAIL: ci@example.com
        run: npx cdk synth

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - backend
      - frontend
      - infra

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: peace-wishlist-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: peace-wishlist-${{ github.run_id }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      - name: Get production API URL
        id: api
        run: |
          api_url="$(
            aws cloudformation describe-stacks \
              --stack-name PeaceWishlistStack \
              --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" \
              --output text
          )"

          if [ -z "$api_url" ] || [ "$api_url" = "None" ]; then
            echo "ApiUrl output was not found." >&2
            exit 1
          fi

          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.api.outputs.api_url }}
        run: npm run build

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci

      - name: Build infrastructure
        working-directory: infra
        run: npm run build

      - name: Deploy application
        working-directory: infra
        env:
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: npx cdk deploy PeaceWishlistStack --require-approval never
        